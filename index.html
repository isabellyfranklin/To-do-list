<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To do list</title>
</head>
<body>
    <main>
        <span>JULHO 2026</span>
        <h1>Minha tarefas</h1>

        <div class="tarefas" >
            <ul id="SuaLista">
              
            </ul>

            <div class="semTarefas" id="semTarefa" style="display: none;">
                <span class="icon-certo">✔️</span>
                <h2>Nenhuma Tarefa ainda</h2>
                <p>Adicione sua primeira rotina abaixa</p>
            </div>

            <button id="BtnNovaTarefa" >+  Nova Tarefa </button>
             
            <!--Nova tarefa-->
            <div class="novaTarefa" id="novaTarefa" style="display: none;">
                <h3>Nova tarefa</h3>
                <label for="">Nome da tarefa: </label>
                <input type="text" class="nome-tarefa" placeholder="Ex: Meditar, Academia, Leitura..." id="nome-tarefa">

                <h4>Vezes por semana:  <span id="resultado-vezes"></span></h4>
                <div class="quantos-vezes">
                    <div class="vezes">1</div>
                    <div class="vezes">2</div>
                    <div class="vezes">3</div>
                    <div class="vezes">4</div>
                    <div class="vezes">5</div>
                    <div class="vezes">6</div>
                    <div class="vezes">7</div>
                </div>

                <h4>Cor: </h4>
                <div class="escolher-cores">
                    <div class="cores" style="background-color: brown;"></div>
                    <div class="cores" style="background-color: pink;"></div>
                    <div class="cores" style="background-color: rgb(64, 156, 255);"></div>
                    <div class="cores" style="background-color: rgb(70, 227, 70);"></div>
                    <div class="cores" style="background-color: rgb(255, 206, 114);"></div>
                    <div class="cores" style="background-color: rgb(255, 255, 140);"></div>
                </div>

                <div class="btns">
                    <button style="width: 75%; color: black;"    onclick="adicionar()">Adicionar</button>
                    <button style="width: 35%;  border: none"  onclick="cancelar()">Cancelar</button>
                </div>
             </div>

             

        </div>

        

    </main>
    <script src="script.js"></script>
</body>
</html>
